# GaragePro Consign — shared base (all profiles)
spring:
  application:
    name: project-group-1
  profiles:
    default: dev
  # Nguyễn Phúc Khang: đọc thêm file .env ở thư mục gốc dự án (đã gitignore) để lấy key Cloudinary.
  # Không có file .env thì vẫn chạy bình thường, chỉ là chưa upload được.
  config:
    import: optional:file:.env[.properties]
  # Nguyễn Phúc Khang: mỗi tệp tối đa 10MB, một lần gửi form tối đa 120MB (đủ 10 ảnh và vài tệp giấy tờ).
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 120MB
  main:
    banner-mode: console
    register-shutdown-hook: true
  jmx:
    enabled: false
  mvc:
    throw-exception-if-no-handler-found: false
  web:
    resources:
      add-mappings: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html
    check-template-location: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
          batch_size: 25
        order_inserts: true
        order_updates: true

server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
    min-response-size: 1024
  error:
    path: /error
    whitelabel:
      enabled: false
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
  tomcat:
    uri-encoding: UTF-8
    max-connections: 8192
    accept-count: 100
    connection-timeout: 20s
    keep-alive-timeout: 30s
    threads:
      max: 200
      min-spare: 10
    max-http-form-post-size: 2MB
    # Nguyễn Phúc Khang: phải lớn hơn max-request-size. Nếu nhỏ hơn, tệp quá dung lượng làm Tomcat
    # cắt kết nối (trình duyệt báo connection reset) thay vì hiện trang lỗi 413.
    max-swallow-size: 130MB

# Nguyễn Phúc Khang: key Cloudinary lấy từ biến môi trường hoặc file .env, tuyệt đối không ghi thẳng vào đây.
# Mẫu các biến cần khai báo nằm trong .env.example.
app:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    fu.he.training.fall2026: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
