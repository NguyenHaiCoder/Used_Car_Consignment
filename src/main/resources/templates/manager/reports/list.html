<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shell/layout :: page('Báo cáo vận hành', 'Quản lý', 'manager-reports',
                    null, ~{::link}, ~{::#news-list})}">
<head>
  <title>Báo cáo</title>
  <th:block th:fragment="link">
    <link rel="stylesheet" th:href="@{/css/app/consignment-workflow.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-contracts.css}">
    <link rel="stylesheet" th:href="@{/css/app/inspector-news.css}">
  </th:block>
</head>
<body>
<div id="news-list" class="catalog-wrap workflow">
  <div class="contracts-header">
    <div class="contracts-header-left">
      <div class="contracts-title-icon"><svg th:replace="~{shell/icons :: icon('chart')}"></svg></div>
      <div>
        <h2>Báo cáo vận hành</h2>
        <nav class="contracts-breadcrumb"><a th:href="@{/manager/dashboard}">Quản lý</a><span>/</span><span>Báo cáo</span></nav>
        <p class="news-lead" th:text="${screen.description}">Mô tả</p>
      </div>
    </div>
    <div class="contracts-header-actions" th:if="${screen != null and !#lists.isEmpty(screen.actions)}">
      <a class="btn-c btn-c--primary" th:each="action : ${screen.actions}" th:if="${action.enabled and action.kind == 'link'}"
         th:href="@{${action.url}}" th:text="${action.label}">Xuất</a>
    </div>
  </div>
  <nav th:replace="~{admin/parts :: kpis}"></nav>
</div>
</body>
</html>
