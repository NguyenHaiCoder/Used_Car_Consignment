<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shell/layout :: page('Tổng quan', 'Quản lý', 'manager-dashboard',
                    null, ~{::link}, ~{::#news-list})}">
<head>
  <title>Tổng quan</title>
  <th:block th:fragment="link">
    <link rel="stylesheet" th:href="@{/css/app/consignment-workflow.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-contracts.css}">
    <link rel="stylesheet" th:href="@{/css/app/inspector-news.css}">
  </th:block>
</head>
<body>
<div id="news-list" class="catalog-wrap workflow">
  <div class="contracts-header">
    <div class="contracts-header-left">
      <div class="contracts-title-icon"><svg th:replace="~{shell/icons :: icon('grid')}"></svg></div>
      <div>
        <h2>Tổng quan</h2>
        <nav class="contracts-breadcrumb"><a th:href="@{/manager/dashboard}">Quản lý</a><span>/</span><span>Tổng quan</span></nav>
        <p class="news-lead" th:text="${screen.description}">Mô tả</p>
      </div>
    </div>
    <div class="contracts-header-actions">
      <a class="btn-c btn-c--primary" th:href="@{/manager/approvals}">Hàng đợi phê duyệt</a>
    </div>
  </div>
  <nav th:replace="~{admin/parts :: kpis}"></nav>
  <section th:replace="~{admin/parts :: table('plain')}"></section>
</div>
</body>
</html>
