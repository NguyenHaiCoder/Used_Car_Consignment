<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/header :: head(${'Quyết toán ' + settlement.code})}"></head>
<body class="ui-app">
<a class="skip-link" href="#main">Bỏ qua điều hướng</a>
<div th:replace="~{common/sidebar :: sidebar}"></div>
<button class="nav-overlay" aria-label="Đóng điều hướng" hidden></button>
<header th:replace="~{common/header :: header}"></header>

<main id="main" class="main-content" tabindex="-1">
  <div class="page-header">
    <div>
      <p class="eyebrow">Điều hành</p>
      <h1 th:text="${'Quyết toán ' + settlement.code + ' · ' + settlement.contractCode}">Quyết toán</h1>
      <p class="page-description">Đọc số liệu Tài chính lập, kiểm tra agreement và khoản thu, rồi quyết định kèm lý do. Manager không sửa số tiền.</p>
    </div>
    <div class="page-actions"><a class="button" th:href="@{/manager/settlements}">Danh sách quyết toán</a></div>
  </div>

  <th:block th:replace="~{finance/fragments :: flash}"></th:block>
  <div class="detail-grid">
    <section th:replace="~{finance/settlements/formula :: formula(${settlement})}"></section>
    <section th:replace="~{finance/fragments :: contract(${contract})}"></section>
  </div>

  <section th:replace="~{finance/fragments :: checks('Điều kiện quyết toán', ${checks})}"></section>

  <section class="content-card" th:if="${settlement.status.name() == 'PENDING_REVIEW'}">
    <div class="content-card-header"><h2>Quyết định</h2><span class="caption">* Thông tin bắt buộc</span></div>
    <form id="decision-form" method="post" novalidate th:action="@{/manager/settlements/decision}" th:object="${form}">
      <input type="hidden" th:field="*{id}">
      <p class="field-error" th:if="${#fields.hasErrors('*')}" role="alert">Có thông tin chưa hợp lệ. Vui lòng kiểm tra các trường được đánh dấu.</p>
      <p class="field-error" th:each="err : ${#fields.globalErrors()}" th:text="${err}" role="alert"></p>
      <div class="form-grid">
        <div class="field">
          <label for="field-decision">Quyết định<span class="required" aria-label="bắt buộc"> *</span></label>
          <select id="field-decision" th:field="*{decision}" required>
            <option value="">Chọn quyết định</option>
            <option value="APPROVED">Phê duyệt</option>
            <option value="NEED_MORE_INFO">Yêu cầu bổ sung</option>
            <option value="REJECTED">Từ chối</option>
          </select>
          <small class="field-error" th:errors="*{decision}"></small>
        </div>
        <div class="field full-width">
          <label for="field-reason">Lý do<span class="required" aria-label="bắt buộc"> *</span></label>
          <textarea id="field-reason" th:field="*{reason}" rows="3" maxlength="2000" required></textarea>
          <small class="field-error" th:errors="*{reason}"></small>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="button button-primary">Ghi nhận quyết định</button>
      </div>
    </form>
  </section>
  <p class="alert" th:unless="${settlement.status.name() == 'PENDING_REVIEW'}"
     th:text="${'Quyết toán đang ' + settlement.status + '; chỉ quyết định được khi Tài chính gửi duyệt (PENDING_REVIEW).'}"></p>

  <section th:replace="~{finance/fragments :: history(${history})}"></section>

  <footer th:replace="~{common/footer :: footer}"></footer>
</main>
<script th:src="@{/js/ui/app.js}" defer></script>
</body>
</html>
