<!DOCTYPE html>
<html lang="en" th:fragment="shell(title, content)" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/header :: head(${title})}"></head>
<body class="ui-app" data-app="1" data-role="sales">
<a class="skip-link" href="#main">Skip navigation</a>
<div th:replace="~{common/sidebar :: sidebar(active='scheduling')}"></div>
<button aria-label="Close navigation" class="nav-overlay" hidden></button>
<header th:replace="~{common/header :: header}"></header>
<main class="main-content" id="main" tabindex="-1">
    <div class="page-header">
        <div><p class="eyebrow">Kinh doanh</p>
            <h1>
                <svg th:if="${title == 'Schedule Viewing'}" viewBox="0 0 36 36" fill="none" aria-hidden="true">
                    <rect x="4" y="7" width="28" height="25" rx="3" stroke="currentColor" stroke-width="2.5"/>
                    <path d="M4 15h28M11 3v8M25 3v8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
                <span th:text="${title}"></span>
            </h1>
            <p class="page-description" th:if="${title == 'Schedule Viewing'}">Schedule a vehicle viewing appointment for a sales inquiry. Times shown in Vietnam (UTC+07:00).</p>
            <p class="page-description" th:unless="${title == 'Schedule Viewing'}">Sales inquiries and vehicle appointments. Times shown in Vietnam
                (UTC+07:00).</p></div>
    </div>
    <link rel="stylesheet" th:href="@{/css/ui/buyers.css}">
    <nav aria-label="Sales scheduling tabs" class="buyer-toolbar">
        <a class="button"
           th:classappend="${title == 'Sales Inquiries' or title == 'Create Inquiry' or title == 'Edit Inquiry' or title == 'Delete Inquiry' or title == 'Inquiry Details'} ? 'buyer-primary' : ''"
           th:href="@{/sales/inquiries}">Sales Inquiries</a>
        <a class="button"
           th:classappend="${title == 'Viewings / Test Drive' or title == 'Schedule Viewing' or title == 'Schedule Viewing / Test Drive' or title == 'Edit Viewing / Test Drive' or title == 'Delete Viewing / Test Drive'} ? 'buyer-primary' : ''"
           th:href="@{/sales/viewings}">Viewings / Test Drive</a>
    </nav>
    <p class="alert" role="status" th:if="${success != null}" th:text="${success}"></p>
    <p class="alert buyer-field-error" role="alert" th:if="${error != null}" th:text="${error}"></p>
    <section th:replace="${content}"></section>
    <footer th:replace="~{common/footer :: footer}"></footer>
</main>
<script defer th:src="@{/js/ui/app.js}"></script>
</body>
</html>
