<!DOCTYPE html>
<html lang="vi" th:replace="~{sales/scheduling/layout :: shell('Xóa lịch xem xe / lái thử', ~{::content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<section class="screen-content" id="viewing-delete" th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/ui/viewing-form.css}">
    <section class="content-card viewing-card">
        <h2>Xóa lịch hẹn</h2>
        <p th:text="|Xóa lịch xem xe #${viewing.id}?|"></p>
        <dl class="viewing-delete-facts">
            <dt>Khách mua</dt><dd th:text="${viewing.buyer}"></dd>
            <dt>Xe</dt><dd th:text="${viewing.vehicle}"></dd>
            <dt>Loại</dt><dd th:text="${viewing.type == 'TEST_DRIVE' ? 'Lái thử' : 'Xem xe'}"></dd>
            <dt>Bắt đầu (ICT)</dt><dd th:text="${#temporals.format(viewing.startTime, 'dd/MM/yyyy HH:mm')}"></dd>
        </dl>
        <p>Lịch hẹn sẽ không còn trong danh sách đang hoạt động. Bản ghi vẫn được lưu.</p>
        <p class="alert buyer-field-error" role="alert" th:if="${error != null}" th:text="${error}"></p>
        <p th:if="${error != null}"><a th:href="@{/sales/viewings/{id}/delete(id=${viewing.id})}">Tải lại lịch hẹn</a></p>
        <form method="post" th:action="@{/sales/viewings/{id}/delete(id=${viewing.id})}">
            <input type="hidden" name="revision" th:value="${revision}">
            <div class="viewing-actions">
                <a class="button" th:href="@{/sales/viewings}">Hủy</a>
                <button class="button viewing-delete-button" type="submit" th:disabled="${error != null}">Xác nhận xóa</button>
            </div>
        </form>
    </section>
</section>
</body>
</html>
