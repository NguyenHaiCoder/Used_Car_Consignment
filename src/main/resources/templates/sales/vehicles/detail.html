<!DOCTYPE html>
<html lang="vi" th:replace="~{common/layout :: shell(~{::content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Toyota Camry 2.5Q: edit this page composition here; data comes from Spring Model. -->
<section class="screen-content" data-template="sales/vehicles/detail" th:fragment="content">
    <p class="alert" th:if="${!#strings.isEmpty(screen.notice)}" th:text="${screen.notice}"></p>
    <section th:replace="~{common/fragments/workflow-panels :: topPanels}"></section>
    <div class="detail-grid">
        <section th:replace="~{common/fragments/components :: facts}"></section>
        <section th:replace="~{common/fragments/components :: checks}"></section>
    </div>
    <section th:replace="~{common/fragments/components :: history}"></section>
</section>
</body>
</html>
