<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="shell(title, description, content)">
<head th:replace="~{common/header :: head(${title})}"></head>
<body class="ui-app" data-app="1" data-role="sales">
  <a class="skip-link" href="#main">Skip navigation</a>
  <div th:replace="~{common/sidebar :: sidebar(active='buyers')}"></div>
  <button class="nav-overlay" aria-label="Close navigation" hidden></button>
  <header th:replace="~{common/header :: header}"></header>
  <main id="main" class="main-content" tabindex="-1">
    <div class="page-header">
      <div><p class="eyebrow">Kinh doanh</p><h1 th:text="${title}"></h1><p class="page-description" th:text="${description}"></p></div>
    </div>
    <section th:replace="${content}"></section>
    <footer th:replace="~{common/footer :: footer}"></footer>
  </main>
  <script th:src="@{/js/ui/app.js}" defer></script>
</body>
</html>
