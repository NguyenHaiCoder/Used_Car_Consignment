<!DOCTYPE html>
<!--/* Tạo tư vấn — Sales nhập khách gọi điện / tại showroom. */-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shell/layout :: page('Tạo tư vấn', 'Kinh doanh', 'sales-inquiries',
                    null, ~{::link}, ~{::#inquiry-create})}">
<head>
  <title>Tạo tư vấn</title>
  <th:block th:fragment="link">
    <link rel="stylesheet" th:href="@{/css/app/consignment-workflow.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-contracts.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-create.css}">
    <link rel="stylesheet" th:href="@{/css/app/sales-inquiry-forms.css}">
  </th:block>
</head>
<body>
<div id="inquiry-create" class="create-wrap inq-form-page">
  <div class="contracts-header">
    <div class="contracts-header-left">
      <div class="contracts-title-icon"><svg th:replace="~{shell/icons :: icon('chat')}"></svg></div>
      <div>
        <h2>Tạo tư vấn</h2>
        <nav class="contracts-breadcrumb" aria-label="Vị trí trang">
          <a th:href="@{/sales/inquiries}">Tư vấn &amp; lịch xem xe</a>
          <span>/</span>
          <span>Tạo tư vấn</span>
        </nav>
      </div>
    </div>
  </div>

  <form class="inq-form" method="post" th:action="@{/sales/inquiries}" th:object="${form}" novalidate>
    <p class="flash flash--error" th:if="${#fields.hasGlobalErrors()}"
       th:each="err : ${#fields.globalErrors()}" th:text="${err}" role="alert"></p>
    <p class="flash flash--error" th:if="${formError}" th:text="${formError}" role="alert"></p>

    <section class="section-card">
      <div class="section-head">
        <svg th:replace="~{shell/icons :: icon('user')}"></svg>
        <h3>Khách hàng</h3>
      </div>
      <div class="section-body">
        <div class="form-row form-row--2">
          <div class="field">
            <label for="inq-phone">Số điện thoại <span class="req">*</span></label>
            <div class="field-input">
              <input id="inq-phone" type="tel" th:field="*{phone}" maxlength="20" autofocus
                     placeholder="Ví dụ: 0912 345 678"
                     th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
            </div>
            <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
          </div>
          <div class="field">
            <label for="inq-name">Họ và tên <span class="req">*</span></label>
            <div class="field-input">
              <input id="inq-name" th:field="*{fullName}" maxlength="160"
                     placeholder="Nhập họ và tên"
                     th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
            </div>
            <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
          </div>
        </div>
        <section th:replace="~{sales/inquiries/fields :: buyerExtra}"></section>
        <label class="check-item">
          <input type="checkbox" th:field="*{consent}">
          Khách đã đồng ý cho lưu thông tin để liên hệ tư vấn <span class="req">*</span>
        </label>
        <span class="field-error" th:if="${#fields.hasErrors('consentAccepted')}" th:errors="*{consentAccepted}"></span>
      </div>
    </section>

    <section class="section-card">
      <div class="section-head">
        <svg th:replace="~{shell/icons :: icon('car')}"></svg>
        <h3>Xe và nhu cầu</h3>
      </div>
      <div class="section-body">
        <div class="form-row form-row--2">
          <div class="field">
            <label for="inq-car">Xe quan tâm <span class="req">*</span></label>
            <span class="select" th:classappend="${#fields.hasErrors('car')} ? 'is-invalid'">
              <select id="inq-car" th:field="*{car}">
                <option value="">Chọn xe đang bán</option>
                <option th:each="c : ${cars}" th:value="${c.key}"
                        th:text="${c.value['title'] + ' · ' + #numbers.formatInteger(c.value['price'], 1, 'POINT') + ' ₫'}">Xe</option>
              </select>
            </span>
            <span class="field-error" th:if="${#fields.hasErrors('car')}" th:errors="*{car}"></span>
          </div>
          <div class="field">
            <label for="inq-channel">Nguồn yêu cầu</label>
            <span class="select">
              <select id="inq-channel" th:field="*{channel}">
                <option th:each="c : ${channels}" th:value="${c.key}" th:text="${c.value}">Nguồn</option>
              </select>
            </span>
          </div>
        </div>
        <fieldset th:replace="~{sales/inquiries/fields :: needChoice}"></fieldset>
        <div class="field">
          <label for="inq-note">Ghi chú tư vấn</label>
          <textarea class="field-textarea" id="inq-note" th:field="*{note}" rows="3" maxlength="2000"
                    placeholder="Nội dung khách trao đổi"
                    th:classappend="${#fields.hasErrors('note')} ? 'is-invalid'"></textarea>
          <span class="field-error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></span>
        </div>
      </div>
    </section>

    <section th:replace="~{sales/inquiries/fields :: demand}"></section>

    <div class="create-actions">
      <a class="btn-c btn-c--ghost" th:href="@{/sales/inquiries}">Hủy</a>
      <button class="btn-c btn-c--primary" type="submit">
        <svg th:replace="~{shell/icons :: icon('plus')}"></svg>Tạo tư vấn
      </button>
    </div>
  </form>
</div>
</body>
</html>
