<!DOCTYPE html>
<html lang="vi" th:replace="~{common/layout :: shell(~{::content})}" xmlns:th="http://www.thymeleaf.org">

<body>
    <section class="screen-content" data-template="sales/inquiries/detail" th:fragment="content">
        <p class="alert" th:if="${!#strings.isEmpty(screen.notice)}" th:text="${screen.notice}"></p>
        <div class="detail-grid">
            <section th:replace="~{common/fragments/components :: facts}"></section>
            <section th:replace="~{common/fragments/components :: checks}"></section>
        </div>
        <section th:replace="~{common/fragments/forms :: form}"></section>
        <section th:replace="~{common/fragments/components :: history}"></section>
    </section>
</body>

</html>
