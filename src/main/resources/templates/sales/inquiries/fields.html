<!DOCTYPE html>
<!--/* Đỗ Lan Anh: Phần nhập dùng chung của create.html và edit.html (th:object=${form}). */-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>

<section th:fragment="buyerExtra" class="form-row form-row--2">
  <div class="field">
    <label for="inq-email">Email</label>
    <div class="field-input">
      <input id="inq-email" type="email" th:field="*{email}" maxlength="180" placeholder="Không bắt buộc"
             th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
    </div>
    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
  </div>
  <div class="field">
    <label for="inq-area">Khu vực</label>
    <div class="field-input">
      <input id="inq-area" th:field="*{area}" maxlength="120" placeholder="Ví dụ: Hà Nội – Cầu Giấy"
             th:classappend="${#fields.hasErrors('area')} ? 'is-invalid'">
    </div>
    <span class="field-error" th:if="${#fields.hasErrors('area')}" th:errors="*{area}"></span>
  </div>
  <div class="field col-span-2">
    <label for="inq-buyer-note">Ghi chú về khách</label>
    <textarea class="field-textarea" id="inq-buyer-note" th:field="*{buyerNote}" rows="2" maxlength="500"
              placeholder="Ví dụ: Gia đình 4 người, tiện nghe máy sau 18h"
              th:classappend="${#fields.hasErrors('buyerNote')} ? 'is-invalid'"></textarea>
    <span class="field-error" th:if="${#fields.hasErrors('buyerNote')}" th:errors="*{buyerNote}"></span>
  </div>
</section>

<section th:fragment="demand" class="section-card">
  <div class="section-head">
    <svg th:replace="~{shell/icons :: icon('coins')}"></svg>
    <h3>Nhu cầu mua xe</h3>
  </div>
  <div class="section-body">
    <div class="form-row form-row--2">
      <div class="field">
        <label for="inq-budget-min">Ngân sách từ (triệu đồng)</label>
        <div class="field-input">
          <input id="inq-budget-min" type="number" th:field="*{budgetMin}" min="0" max="99999" placeholder="Ví dụ: 750">
        </div>
      </div>
      <div class="field">
        <label for="inq-budget-max">Đến (triệu đồng)</label>
        <div class="field-input">
          <input id="inq-budget-max" type="number" th:field="*{budgetMax}" min="0" max="99999" placeholder="Ví dụ: 780">
        </div>
      </div>
      <div class="field">
        <label for="inq-priorities">Ưu tiên</label>
        <div class="field-input">
          <input id="inq-priorities" th:field="*{priorities}" maxlength="200" placeholder="Cách nhau bằng dấu phẩy: Màu xanh, Xe gia đình">
        </div>
      </div>
      <div class="field">
        <label for="inq-buy-time">Thời gian mua</label>
        <div class="field-input">
          <input id="inq-buy-time" th:field="*{buyTime}" maxlength="80" placeholder="Ví dụ: Trong tháng 11/2026">
        </div>
      </div>
    </div>
  </div>
</section>

<fieldset th:fragment="needChoice" class="inq-need">
  <legend>Khách cần gì? <span class="req">*</span></legend>
  <label th:each="n : ${needs}">
    <input type="radio" th:field="*{need}" th:value="${n.key}">
    <span th:text="${n.value}">Nhu cầu</span>
  </label>
  <span class="field-error" th:if="${#fields.hasErrors('need')}" th:errors="*{need}"></span>
</fieldset>

</body></html>
