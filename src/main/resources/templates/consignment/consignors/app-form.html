<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/header :: head(${form.id != null ? 'Sửa hồ sơ chủ xe' : 'Tạo hồ sơ chủ xe'})}"></head>
<body class="ui-app">
<a class="skip-link" href="#main">Bỏ qua điều hướng</a>
<div th:replace="~{common/sidebar :: sidebar (active='consignors')}"></div>
<button class="nav-overlay" aria-label="Đóng điều hướng" hidden></button>
<header th:replace="~{common/header :: header}"></header>

<main id="main" class="main-content" tabindex="-1">
  <div class="page-header">
    <div>
      <p class="eyebrow">Ký gửi</p>
      <h1 th:text="${form.id != null ? 'Sửa hồ sơ chủ xe' : 'Tạo hồ sơ chủ xe'}">Tạo hồ sơ chủ xe</h1>
      <p class="page-description">Thông tin liên hệ, đồng ý lưu dữ liệu và tài khoản nhận tiền.</p>
    </div>
    <div class="page-actions"><a class="button" th:href="@{/consignment/consignors}">Danh sách chủ xe</a></div>
  </div>

  <section class="content-card">
    <div class="content-card-header">
      <h2>Nhập thông tin</h2><span class="caption">* Thông tin bắt buộc</span>
    </div>
    <form id="consignor-form" method="post" novalidate th:action="@{/consignment/consignors}" th:object="${form}">
      <input type="hidden" th:field="*{id}">
      <p class="field-error" th:if="${#fields.hasErrors('*')}" role="alert">Có thông tin chưa hợp lệ. Vui lòng kiểm tra các trường được đánh dấu.</p>
      <p class="field-error" th:each="err : ${#fields.globalErrors()}" th:text="${err}" role="alert"></p>
      <div class="form-grid">
        <div class="field">
          <label for="field-fullName">Họ và tên<span class="required" aria-label="bắt buộc"> *</span></label>
          <input type="text" id="field-fullName" th:field="*{fullName}" maxlength="160" required>
          <small class="field-error" th:errors="*{fullName}"></small>
        </div>
        <div class="field">
          <label for="field-phone">Số điện thoại<span class="required" aria-label="bắt buộc"> *</span></label>
          <input type="tel" id="field-phone" th:field="*{phone}" required>
          <small class="field-hint">10–11 chữ số.</small>
          <small class="field-error" th:errors="*{phone}"></small>
        </div>
        <div class="field">
          <label for="field-email">Email</label>
          <input type="email" id="field-email" th:field="*{email}" maxlength="180">
          <small class="field-error" th:errors="*{email}"></small>
        </div>
        <div class="field">
          <label for="field-idNumber">Số CCCD<span class="required" aria-label="bắt buộc"> *</span></label>
          <input type="text" id="field-idNumber" th:field="*{idNumber}" required>
          <small class="field-hint">12 chữ số.</small>
          <small class="field-error" th:errors="*{idNumber}"></small>
        </div>
        <div class="field full-width">
          <label for="field-address">Địa chỉ</label>
          <textarea id="field-address" th:field="*{address}" rows="3" maxlength="500"></textarea>
          <small class="field-error" th:errors="*{address}"></small>
        </div>
        <div class="field">
          <label for="field-bank">Ngân hàng<span class="required" aria-label="bắt buộc"> *</span></label>
          <input type="text" id="field-bank" th:field="*{bank}" maxlength="120" required>
          <small class="field-error" th:errors="*{bank}"></small>
        </div>
        <div class="field">
          <label for="field-accountNumber">Số tài khoản<span class="required" aria-label="bắt buộc"> *</span></label>
          <input type="text" id="field-accountNumber" th:field="*{accountNumber}" inputmode="numeric" required>
          <small class="field-error" th:errors="*{accountNumber}"></small>
        </div>
        <div class="field">
          <label for="field-accountName">Tên chủ tài khoản<span class="required" aria-label="bắt buộc"> *</span></label>
          <input type="text" id="field-accountName" th:field="*{accountName}" maxlength="160" required>
          <small class="field-error" th:errors="*{accountName}"></small>
        </div>
        <div class="field full-width">
          <label for="field-consentStored">
            <input type="checkbox" id="field-consentStored" th:field="*{consentStored}">
            Đã nhận sự đồng ý lưu thông tin cá nhân<span class="required" aria-label="bắt buộc"> *</span>
          </label>
          <small class="field-error" th:errors="*{consentStored}"></small>
        </div>
      </div>
      <div class="form-actions">
        <a class="button" th:href="@{${form.id != null ? '/consignment/consignors/' + form.id : '/consignment/consignors'}}">Hủy</a>
        <button type="submit" class="button button-primary" th:text="${form.id != null ? 'Lưu thay đổi' : 'Tạo chủ xe'}">Lưu</button>
      </div>
    </form>
  </section>

  <footer th:replace="~{common/footer :: footer}"></footer>
</main>
<script th:src="@{/js/ui/app.js}" defer></script>
</body>
</html>
