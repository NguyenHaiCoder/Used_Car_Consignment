<!DOCTYPE html>
<!--/* Hà Lệ Quyên: Màn sửa hồ sơ ký gửi (DRAFT) — cùng form với màn tạo, sửa luôn chủ xe + xe + hồ sơ (POST /consignments).
       Model: form (ConsignmentCreateRequest, phẳng), vehicleModels, vehicleTypes. */-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shell/layout :: page(
          'Sửa hồ sơ ký gửi',
          'Hệ thống Quản lý Ký gửi xe',
          'consignments',
          null,
          ~{::link},
          ~{::#edit-consignment})}">
<head>
  <th:block th:fragment="link">
    <link rel="stylesheet" th:href="@{/css/app/consignment-workflow.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-create.css}">
    <script th:src="@{/js/app/consignment-create.js}" defer></script>
  </th:block>
</head>
<body>

<div id="edit-consignment" class="create-wrap">

  <!--/* ── HEADER: tiêu đề ── */-->
  <div class="create-header">
    <div class="create-title-row">
      <div class="create-title-icon">
        <svg class="ic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>
        </svg>
      </div>
      <div>
        <nav class="create-breadcrumb">
          <a th:href="@{/consignments}">Consignment</a>
          <span>/</span><span>Edit</span>
        </nav>
        <h2>Sửa hồ sơ ký gửi</h2>
      </div>
      <span class="badge-draft">Lưu nháp</span>
    </div>
  </div>

  <p class="flash" th:if="${flashMessage}" th:text="${flashMessage}" role="status"></p>

  <form th:action="@{/consignments}" th:object="${form}" method="post" novalidate>
  <input type="hidden" th:field="*{id}">

  <p class="flash flash--error" th:each="e : ${#fields.globalErrors()}" th:text="${e}" role="alert"></p>

  <div class="create-layout">
    <div class="create-form-col" style="display:flex;flex-direction:column;gap:14px;">

      <!--/* ── Section A: Chủ xe (Consignor) ── */-->
      <div class="section-card">
        <div class="section-head">
          <svg class="ic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
          <h3>A. Thông tin chủ xe</h3>
          <span class="section-hint-pill">Tạo kèm hồ sơ</span>
        </div>
        <div class="section-body">
          <div class="form-row form-row--3">
            <div class="field">
              <label>Họ tên <span class="req">*</span></label>
              <div class="field-input"><input type="text" th:field="*{consignorName}" placeholder="Nguyễn Văn A" maxlength="160"></div>
              <span class="field-error" th:if="${#fields.hasErrors('consignorName')}" th:errors="*{consignorName}"></span>
            </div>
            <div class="field">
              <label>Số điện thoại <span class="req">*</span></label>
              <div class="field-input"><input type="tel" th:field="*{phone}" placeholder="0912345678" maxlength="11"></div>
              <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>
            <div class="field">
              <label>CCCD <span class="req">*</span></label>
              <div class="field-input"><input type="text" th:field="*{idNumber}" placeholder="12 chữ số" maxlength="12"></div>
              <span class="field-error" th:if="${#fields.hasErrors('idNumber')}" th:errors="*{idNumber}"></span>
            </div>
          </div>
          <div class="form-row form-row--2">
            <div class="field">
              <label>Email <span class="req">*</span></label>
              <div class="field-input"><input type="email" th:field="*{email}" placeholder="email@example.com" maxlength="180"></div>
              <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <div class="field">
              <label>Địa chỉ <span class="req">*</span></label>
              <div class="field-input"><input type="text" th:field="*{address}" placeholder="Địa chỉ" maxlength="500"></div>
              <span class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
            </div>
          </div>
          <div class="form-row form-row--3">
            <div class="field">
              <label>Ngân hàng <span class="req">*</span></label>
              <div class="field-input"><input type="text" th:field="*{bank}" placeholder="Vietcombank" maxlength="120"></div>
              <span class="field-error" th:if="${#fields.hasErrors('bank')}" th:errors="*{bank}"></span>
            </div>
            <div class="field">
              <label>Số tài khoản <span class="req">*</span></label>
              <div class="field-input"><input type="text" th:field="*{accountNumber}" placeholder="6–20 chữ số" maxlength="20"></div>
              <span class="field-error" th:if="${#fields.hasErrors('accountNumber')}" th:errors="*{accountNumber}"></span>
            </div>
            <div class="field">
              <label>Tên chủ tài khoản <span class="req">*</span></label>
              <div class="field-input"><input type="text" th:field="*{accountName}" placeholder="NGUYEN VAN A" maxlength="160"></div>
              <span class="field-error" th:if="${#fields.hasErrors('accountName')}" th:errors="*{accountName}"></span>
            </div>
          </div>
          <div class="field">
            <label class="check-item">
              <input type="checkbox" th:field="*{consentStored}">
              Chủ xe đồng ý cung cấp và lưu trữ thông tin cá nhân <span class="req">*</span>
            </label>
            <span class="field-error" th:if="${#fields.hasErrors('consentStored')}" th:errors="*{consentStored}"></span>
          </div>
        </div>
      </div>

      <!--/* ── Section B: Xe (Vehicle) ── */-->
      <div class="section-card">
        <div class="section-head">
          <svg class="ic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 17H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v9a2 2 0 0 1-2 2h-3"/>
            <circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>
          </svg>
          <h3>B. Thông tin xe</h3>
        </div>
        <div class="section-body">
          <div class="form-row form-row--3">
            <div class="field">
              <label>Dòng xe <span class="req">*</span></label>
              <select id="vehicle-model" class="field-select" th:field="*{vehicleModelId}"
                      data-brand-target="#vehicle-brand">
                <option value="">Chọn dòng xe</option>
                <option th:each="m : ${vehicleModels}" th:value="${m.id}" th:text="${m.name}"
                        th:attr="data-brand=${m.brandName}">Tucson</option>
              </select>
              <span class="field-error" th:if="${#fields.hasErrors('vehicleModelId')}" th:errors="*{vehicleModelId}"></span>
            </div>
            <div class="field">
              <label>Hãng xe</label>
              <div class="field-input">
                <input id="vehicle-brand" type="text" readonly placeholder="Chọn dòng xe trước"
                       title="Tự điền theo dòng xe đã chọn">
              </div>
            </div>
            <div class="field">
              <label>Loại xe <span class="req">*</span></label>
              <select class="field-select" th:field="*{vehicleType}">
                <option value="">Chọn loại xe</option>
                <option th:each="t : ${vehicleTypes}" th:value="${t.label}" th:text="${t.label}">SUV</option>
              </select>
              <span class="field-error" th:if="${#fields.hasErrors('vehicleType')}" th:errors="*{vehicleType}"></span>
            </div>
          </div>
          <div class="form-row form-row--3">
            <div class="field">
              <label>Biển số <span class="req">*</span></label>
              <div class="field-input"><input type="text" th:field="*{licensePlate}" placeholder="51H-678.90" maxlength="20"></div>
              <span class="field-error" th:if="${#fields.hasErrors('licensePlate')}" th:errors="*{licensePlate}"></span>
            </div>
            <div class="field">
              <label>Năm sản xuất <span class="req">*</span></label>
              <div class="field-input"><input type="number" th:field="*{year}" placeholder="2022" min="1950" max="2100"></div>
              <span class="field-error" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></span>
            </div>
            <div class="field">
              <label>Màu sắc <span class="req">*</span></label>
              <div class="field-input"><input type="text" th:field="*{color}" placeholder="Màu sắc" maxlength="40"></div>
              <span class="field-error" th:if="${#fields.hasErrors('color')}" th:errors="*{color}"></span>
            </div>
          </div>
          <div class="form-row form-row--3">
            <div class="field">
              <label>Số km <span class="req">*</span></label>
              <div class="field-input">
                <input type="number" th:field="*{odometerKm}" placeholder="38650" min="0" style="flex:1">
                <span style="font-size:11px;color:var(--mute);flex:none">km</span>
              </div>
              <span class="field-error" th:if="${#fields.hasErrors('odometerKm')}" th:errors="*{odometerKm}"></span>
            </div>
            <div class="field">
              <label>Hộp số <span class="req">*</span></label>
              <select class="field-select" th:field="*{transmission}">
                <option value="">Chọn hộp số</option>
                <option value="Số sàn">Số sàn</option>
                <option value="Số tự động">Số tự động</option>
              </select>
              <span class="field-error" th:if="${#fields.hasErrors('transmission')}" th:errors="*{transmission}"></span>
            </div>
            <div class="field">
              <label>Nhiên liệu <span class="req">*</span></label>
              <select class="field-select" th:field="*{fuelType}">
                <option value="Xăng">Xăng</option>
                <option value="Diesel">Diesel</option>
                <option value="Điện">Điện</option>
                <option value="Hybrid">Hybrid</option>
              </select>
              <span class="field-error" th:if="${#fields.hasErrors('fuelType')}" th:errors="*{fuelType}"></span>
            </div>
          </div>
          <div class="form-row form-row--2">
            <div class="field">
              <label>Số khung (VIN) <span class="req">*</span></label>
              <div class="field-input"><input type="text" th:field="*{vin}" placeholder="KMHJ3815NNU123456" maxlength="32"></div>
              <span class="field-error" th:if="${#fields.hasErrors('vin')}" th:errors="*{vin}"></span>
            </div>
            <div class="field">
              <label>Số máy <span class="req">*</span></label>
              <div class="field-input"><input type="text" th:field="*{engineNumber}" placeholder="G4NLMN123456" maxlength="40"></div>
              <span class="field-error" th:if="${#fields.hasErrors('engineNumber')}" th:errors="*{engineNumber}"></span>
            </div>
          </div>
        </div>
      </div>

      <!--/* ── Section C: Tiếp nhận xe ── */-->
      <div class="section-card">
        <div class="section-head">
          <svg class="ic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <path d="M22 4 12 14.01l-3-3"/>
          </svg>
          <h3>C. Tiếp nhận xe</h3>
        </div>
        <div class="section-body">
          <div class="form-row form-row--3">
            <div class="field">
              <label>Ngày tiếp nhận <span class="req">*</span></label>
              <div class="date-range" role="group" aria-label="Ngày tiếp nhận" data-date-range lang="vi-VN">
                <svg th:replace="~{shell/icons :: icon('calendar-check')}"></svg>
                <label class="date-range-field">
                  <span class="sr-only">Ngày tiếp nhận</span>
                  <input class="date-range-display" type="text" inputmode="numeric" maxlength="10"
                         placeholder="dd/mm/yyyy" autocomplete="off" aria-label="Ngày tiếp nhận"
                         th:value="${form.intakeDate != null ? #temporals.format(form.intakeDate, 'dd/MM/yyyy') : ''}">
                  <input class="date-range-native" type="date" th:field="*{intakeDate}" lang="vi-VN"
                         tabindex="-1" aria-hidden="true">
                </label>
              </div>
              <span class="field-error" th:if="${#fields.hasErrors('intakeDate')}" th:errors="*{intakeDate}"></span>
            </div>
            <div class="field">
              <label>Nơi để xe <span class="req">*</span></label>
              <div class="field-input"><input type="text" th:field="*{location}" placeholder="Vị trí xe hiện tại" maxlength="160"></div>
              <span class="field-error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></span>
            </div>
            <div class="field">
              <label>Nơi lưu giữ <span class="req">*</span></label>
              <div class="field-input"><input type="text" th:field="*{custodyLocation}" placeholder="Bãi / kho lưu giữ xe" maxlength="160"></div>
              <span class="field-error" th:if="${#fields.hasErrors('custodyLocation')}" th:errors="*{custodyLocation}"></span>
            </div>
          </div>
          <div class="field">
            <label>Ghi chú tiếp nhận</label>
            <textarea class="field-textarea" rows="3" th:field="*{intakeCondition}" maxlength="1000"
                      placeholder="Ghi chú về tình trạng xe, vết xước, hư hỏng..."></textarea>
            <span class="field-error" th:if="${#fields.hasErrors('intakeCondition')}" th:errors="*{intakeCondition}"></span>
          </div>
        </div>
      </div>

      <!--/* ── Section D: Thông tin ký gửi ── */-->
      <div class="section-card">
        <div class="section-head">
          <svg class="ic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          <h3>D. Thông tin ký gửi</h3>
        </div>
        <div class="section-body">
          <div class="form-row form-row--2">
            <div class="field">
              <label>Giá mong muốn của chủ xe <span class="req">*</span></label>
              <div class="field-input">
                <input type="number" th:field="*{expectedPrice}" min="1" step="1" placeholder="780000000" style="flex:1">
                <span style="font-size:11px;color:var(--mute);flex:none">VNĐ</span>
              </div>
              <span class="field-error" th:if="${#fields.hasErrors('expectedPrice')}" th:errors="*{expectedPrice}"></span>
            </div>
          </div>
          <div class="form-row form-row--1">
            <div class="field">
              <label>Ghi chú điều khoản</label>
              <textarea class="field-textarea" rows="4" th:field="*{termNotes}" maxlength="2000"
                        placeholder="Ghi chú điều khoản..."></textarea>
              <span class="field-error" th:if="${#fields.hasErrors('termNotes')}" th:errors="*{termNotes}"></span>
            </div>
          </div>
        </div>
      </div>

    </div><!--/* end create-form-col */-->
  </div><!--/* end create-layout */-->

  <!--/* ── ACTION BAR ── */-->
  <div class="create-actions">
    <a class="btn btn--ghost" th:href="@{/consignments/{id}(id=${form.id})}">
      <svg class="ic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
      Hủy
    </a>
    <div class="create-actions-right">
      <button type="submit" class="btn btn--outline">
        <svg class="ic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v13a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
        </svg>
        Lưu nháp
      </button>
      <button type="submit" name="submitAfter" value="true" class="btn btn--primary">
        <svg class="ic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/>
        </svg>
        Gửi duyệt
      </button>
    </div>
  </div>

  </form>

</div><!--/* end create-wrap */-->

</body>
</html>
