<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle}">Chi tiết hồ sơ</title>
  <style>
    body { margin:0; font-family:"Segoe UI",sans-serif; background:#f6f8fb; color:#172033; }
    main { max-width:720px; margin:32px auto; padding:0 20px; }
    a { color:#1f4e78; font-weight:600; text-decoration:none; }
    dl { background:#fff; border:1px solid #d0d7e2; border-radius:12px; padding:18px 20px; }
    dt { color:#5b6b7c; font-size:.85rem; margin-top:12px; }
    dd { margin:4px 0 0; font-weight:700; }
  </style>
</head>
<body>
<main>
  <p><a th:href="@{/consignments}">← Danh sách hồ sơ</a></p>
  <h1 th:text="${pageTitle}">Chi tiết</h1>
  <dl th:object="${consignment}">
    <dt>Mã hồ sơ</dt><dd th:text="*{code}">KG-101</dd>
    <dt>Xe</dt><dd th:text="*{vehicle.displayLabel}">—</dd>
    <dt>Chủ xe</dt><dd th:text="*{consignor.fullName}">—</dd>
    <dt>Trạng thái</dt><dd th:text="*{status}">—</dd>
    <dt>Ngày tiếp nhận</dt><dd th:text="${#temporals.format(consignment.intakeDate, 'dd/MM/yyyy')}">—</dd>
  </dl>
</main>
</body>
</html>
