<!DOCTYPE html>
<!--/* Sửa hãng xe — validate Thymeleaf + BindingResult. */-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shell/layout :: page('Sửa hãng xe', 'Hệ thống Quản lý Ký gửi xe', 'brands',
                    null, ~{::link}, ~{::#brand-edit})}">
<head>
  <title>Sửa hãng xe</title>
  <th:block th:fragment="link">
    <link rel="stylesheet" th:href="@{/css/app/consignment-workflow.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-contracts.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-catalog.css}">
  </th:block>
</head>
<body>
<div id="brand-edit" class="catalog-wrap">
  <div class="contracts-header">
    <div class="contracts-header-left">
      <div class="contracts-title-icon"><svg th:replace="~{shell/icons :: icon('pencil')}"></svg></div>
      <div>
        <nav class="contracts-breadcrumb" aria-label="Vị trí trang">
          <a th:href="@{/consignment/brands}">Hãng xe</a>
          <span>/</span>
          <a th:href="@{/consignment/brands/{id}(id=${form.id})}" th:text="${form.name}">Hyundai</a>
          <span>/</span>
          <span>Sửa</span>
        </nav>
        <h2 th:text="${'Sửa hãng xe · ' + form.name}">Sửa hãng xe</h2>
      </div>
    </div>
  </div>

  <form class="catalog-form" method="post" th:action="@{/consignment/brands}" th:object="${form}" novalidate>
    <input type="hidden" th:field="*{id}">
    <p class="flash flash--error" th:if="${#fields.hasGlobalErrors()}"
       th:each="err : ${#fields.globalErrors()}" th:text="${err}" role="alert"></p>

    <div class="form-row">
      <div class="field">
        <label for="name">Tên hãng <span class="req">*</span></label>
        <input id="name" type="text" th:field="*{name}" maxlength="120"
               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
        <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
      </div>
      <div class="field">
        <label for="status">Trạng thái</label>
        <select id="status" th:field="*{status}"
                th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
          <option th:value="ACTIVE">Đang dùng</option>
          <option th:value="INACTIVE">Ngưng hoạt động</option>
        </select>
        <span class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label for="note">Ghi chú</label>
        <input id="note" type="text" th:field="*{note}" maxlength="500"
               th:classappend="${#fields.hasErrors('note')} ? 'is-invalid'">
        <span class="field-error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></span>
      </div>
    </div>

    <div class="catalog-actions">
      <button class="btn-c btn-c--primary" type="submit">Lưu thay đổi</button>
      <a class="btn-c btn-c--ghost" th:href="@{/consignment/brands/{id}(id=${form.id})}">Huỷ</a>
    </div>
  </form>
</div>
</body>
</html>
