<!DOCTYPE html>
<!--/* UI-only: xem hãng xe. */-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shell/layout :: page(${'Hãng xe ' + item.name}, 'Hệ thống Quản lý Ký gửi xe', 'brands',
                    null, ~{::link}, ~{::#brand-view})}">
<head>
  <title>Chi tiết hãng xe</title>
  <th:block th:fragment="link">
    <link rel="stylesheet" th:href="@{/css/app/consignment-workflow.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-contracts.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-catalog.css}">
    <style>
      #brand-view .csb-head .pill { margin-left: auto; }
      #brand-view .meta-row { grid-template-columns: 140px 1fr; }
      #brand-view .detail-actions { display: flex; gap: 8px; padding: 0 14px 14px; }
    </style>
  </th:block>
</head>
<body>
<div id="brand-view" class="catalog-wrap">
  <div class="contracts-header">
    <div class="contracts-header-left">
      <div class="contracts-title-icon"><svg th:replace="~{shell/icons :: icon('tag')}"></svg></div>
      <div>
        <nav class="contracts-breadcrumb" aria-label="Vị trí trang">
          <a th:href="@{/consignment/brands}">Hãng xe</a>
          <span>/</span>
          <span th:text="${item.name}">Hyundai</span>
        </nav>
        <h2 th:text="${item.name}">Hyundai</h2>
      </div>
    </div>
    <div class="contracts-header-actions">
      <a class="btn-c btn-c--outline" th:href="@{/consignment/brands/{id}/edit(id=${item.id})}">Sửa</a>
      <a class="btn-c btn-c--ghost" th:href="@{/consignment/brands}">Danh sách</a>
    </div>
  </div>

  <p class="flash" th:if="${flashMessage}" th:text="${flashMessage}" role="status"></p>

  <section class="csb-card">
    <header class="csb-head">
      <svg th:replace="~{shell/icons :: icon('info')}"></svg>
      <h4>Thông tin hãng xe</h4>
      <span class="pill" th:classappend="${item.status == 'ACTIVE'} ? 'pill--approved' : 'pill--closed'"
            th:text="${item.status == 'ACTIVE'} ? 'Đang dùng' : 'Ngưng hoạt động'">Đang dùng</span>
    </header>
    <div class="csb-body">
      <div class="meta-row"><span class="mk">Mã</span><span class="mv code" th:text="${'HX-' + item.id}">HX-1</span></div>
      <div class="meta-row"><span class="mk">Tên hãng</span><span class="mv" th:text="${item.name}">Hyundai</span></div>
      <div class="meta-row"><span class="mk">Số dòng xe</span><span class="mv" th:text="${item.modelCount}">0</span></div>
      <div class="meta-row"><span class="mk">Ghi chú</span><span class="mv" th:text="${item.note ?: '—'}">—</span></div>
    </div>
    <div class="detail-actions">
      <a class="btn-c btn-c--outline" th:href="@{/consignment/models(brand=${item.name})}">Xem dòng xe</a>
    </div>
  </section>
</div>
</body>
</html>
