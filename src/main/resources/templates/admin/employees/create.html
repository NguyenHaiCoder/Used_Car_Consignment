<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shell/layout :: page('Tạo nhân viên', 'Quản trị', 'admin-employees',
                    null, ~{::link}, ~{::#staff-form})}">
<head>
  <title>Tạo nhân viên</title>
  <th:block th:fragment="link">
    <link rel="stylesheet" th:href="@{/css/app/consignment-workflow.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-contracts.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-create.css}">
    <link rel="stylesheet" th:href="@{/css/app/sales-inquiry-forms.css}">
  </th:block>
</head>
<body>
<div id="staff-form" class="create-wrap inq-form-page">
  <div class="contracts-header">
    <div class="contracts-header-left">
      <div class="contracts-title-icon"><svg th:replace="~{shell/icons :: icon('plus')}"></svg></div>
      <div>
        <h2>Tạo tài khoản nhân viên</h2>
        <nav class="contracts-breadcrumb"><a th:href="@{/admin/employees}">Nhân sự</a><span>/</span><span>Tạo mới</span></nav>
      </div>
    </div>
  </div>
  <p th:replace="~{admin/parts :: notice}"></p>
  <section th:replace="~{admin/parts :: formCard}"></section>
</div>
</body>
</html>
