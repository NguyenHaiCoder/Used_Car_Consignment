<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shell/layout :: page('Nhân sự &amp; tài khoản', 'Quản trị', 'admin-employees',
                    null, ~{::link}, ~{::#news-list})}">
<head>
  <title>Nhân sự</title>
  <th:block th:fragment="link">
    <link rel="stylesheet" th:href="@{/css/app/consignment-workflow.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-contracts.css}">
    <link rel="stylesheet" th:href="@{/css/app/inspector-news.css}">
    <link rel="stylesheet" th:href="@{/css/app/sales-inquiry-forms.css}">
  </th:block>
</head>
<body>
<div id="news-list" class="catalog-wrap workflow">
  <div class="contracts-header">
    <div class="contracts-header-left">
      <div class="contracts-title-icon"><svg th:replace="~{shell/icons :: icon('user')}"></svg></div>
      <div>
        <h2>Nhân sự &amp; tài khoản</h2>
        <nav class="contracts-breadcrumb"><a th:href="@{/admin/employees}">Quản trị</a><span>/</span><span>Nhân sự</span></nav>
        <p class="news-lead" th:text="${screen.description}">Mô tả</p>
      </div>
    </div>
    <div class="contracts-header-actions">
      <a class="btn-c btn-c--primary" th:href="@{/admin/employees/new}"><svg th:replace="~{shell/icons :: icon('plus')}"></svg>Thêm nhân viên</a>
    </div>
  </div>
  <p th:replace="~{admin/parts :: notice}"></p>
  <nav th:replace="~{admin/parts :: kpis}"></nav>
  <section th:replace="~{admin/parts :: table('employees')}"></section>
</div>
</body>
</html>
