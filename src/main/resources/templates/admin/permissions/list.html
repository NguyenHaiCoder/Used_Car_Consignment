<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: shell(~{::content})}">
<body>
<!-- Vai trò &amp; quyền truy cập: edit this page composition here; data comes from Spring Model. -->
<section th:fragment="content" class="screen-content" data-template="admin/permissions/list">
  <p class="alert" th:if="${!#strings.isEmpty(screen.notice)}" th:text="${screen.notice}"></p>
  <section th:replace="~{common/fragments/workflow-panels :: topPanels}"></section>
  <div class="detail-grid">
    <section th:replace="~{common/fragments/components :: facts}"></section>
    <section th:replace="~{common/fragments/components :: checks}"></section>
  </div>
</section>
</body>
</html>
