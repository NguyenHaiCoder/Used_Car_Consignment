<!DOCTYPE html>
<!--/* Nguyễn Vũ Trường An: tiến hành kiểm định — chọn loại, ảnh chứng minh, UI mock. */-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shell/layout :: page(${'Kiểm định ' + vehicle.code}, 'Kiểm định và tiếp nhận xe', 'inspector-vehicles',
                    null, ~{::link}, ~{::#inspector-inspect})}">
<head>
  <title>Kiểm định xe</title>
  <th:block th:fragment="link">
    <link rel="stylesheet" th:href="@{/css/app/consignment-workflow.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-contracts.css}">
    <link rel="stylesheet" th:href="@{/css/app/inspector-vehicles.css}">
  </th:block>
</head>
<body>
<div id="inspector-inspect" class="contracts-wrap">
  <div class="contracts-header">
    <div class="contracts-header-left">
      <div class="contracts-title-icon"><svg th:replace="~{shell/icons :: icon('clipboard')}"></svg></div>
      <div>
        <nav class="contracts-breadcrumb" aria-label="Vị trí trang">
          <a th:href="@{/inspector/vehicles}">Kiểm định xe</a>
          <span>/</span>
          <span th:text="${vehicle.code}">KG-1</span>
        </nav>
        <h2 th:text="${'Kiểm định · ' + vehicle.displayLabel}">Kiểm định</h2>
      </div>
    </div>
  </div>

  <p class="flash" th:if="${flashMessage}" th:text="${flashMessage}" role="status"></p>

  <section class="csb-card">
    <header class="csb-head">
      <svg th:replace="~{shell/icons :: icon('car')}"></svg>
      <h4>Xe đang kiểm định</h4>
    </header>
    <div class="csb-body">
      <div class="meta-row"><span class="mk">Mã hồ sơ</span><span class="mv code" th:text="${vehicle.code}">KG-1</span></div>
      <div class="meta-row"><span class="mk">Xe</span><span class="mv" th:text="${vehicle.displayLabel}">Xe</span></div>
      <div class="meta-row"><span class="mk">VIN</span><span class="mv" th:text="${vehicle.vin}">VIN</span></div>
      <div class="meta-row"><span class="mk">Loại xe</span><span class="mv" th:text="${vehicle.vehicleType}">SUV</span></div>
    </div>
  </section>

  <form class="csb-card inspect-form" style="margin-top:14px;" method="post" enctype="multipart/form-data"
        th:action="@{/inspector/vehicles/{id}/inspect(id=${vehicle.id})}"
        th:attr="data-inspect-base=@{/inspector/vehicles/{id}/inspect(id=${vehicle.id})}">
    <header class="csb-head">
      <svg th:replace="~{shell/icons :: icon('list')}"></svg>
      <h4>Tiến hành kiểm định theo bước</h4>
    </header>

    <div class="inspect-type-field">
      <label for="checklistId">Loại kiểm định <span class="req">*</span></label>
      <span class="select inspect-type-select">
        <select id="checklistId" name="checklistId" required>
          <option value="" disabled th:selected="${selectedChecklistId == null}">— Chọn loại kiểm định —</option>
          <option th:each="c : ${checklists}"
                  th:value="${c['id']}"
                  th:text="${c['name']}"
                  th:selected="${selectedChecklistId == c['id']}">
            Loại kiểm định
          </option>
        </select>
      </span>
    </div>

    <div class="csb-body inspect-steps" style="gap:12px;">
      <div th:each="s : ${steps}" class="inspect-step">
        <label class="inspect-step-head">
          <input type="checkbox" th:name="${'step_' + s.order}" value="PASS">
          <span>
            <strong th:text="${s.order + '. ' + s.title}">Bước</strong>
            <small th:text="${s.hint}">Gợi ý</small>
          </span>
        </label>
        <div class="inspect-step-extra">
          <textarea class="field-textarea" rows="2" th:name="${'note_' + s.order}"
                    placeholder="Ghi chú kết quả (tuỳ chọn)"></textarea>
          <label class="inspect-proof">
            <span class="inspect-proof-label">Hình ảnh chứng minh</span>
            <input type="file" th:name="${'proof_' + s.order}" accept="image/*" multiple>
          </label>
        </div>
      </div>
    </div>

    <section class="inspect-valuation" aria-label="Định giá">
      <header class="csb-head">
        <svg th:replace="~{shell/icons :: icon('coins')}"></svg>
        <h4>Định giá</h4>
      </header>
      <p class="inspect-valuation-hint">
        Giá chào bán sau kiểm định sẽ cập nhật vào hồ sơ ký gửi và hợp đồng.
      </p>
      <div class="inspect-valuation-grid">
        <div class="inspect-valuation-field inspect-valuation-field--full">
          <label for="proposedPrice">Giá chào bán (định giá) <span class="req">*</span></label>
          <div class="inspect-valuation-input">
            <input id="proposedPrice" type="number" name="proposedPrice" min="1" step="any" required
                   placeholder="VD: 750000000"
                   th:value="${valuation != null ? valuation['proposedPrice'] : ''}">
            <span>VNĐ</span>
          </div>
        </div>
        <div class="inspect-valuation-field inspect-valuation-field--full">
          <label for="rationale">Ghi chú định giá</label>
          <textarea id="rationale" class="field-textarea" name="rationale" rows="2"
                    placeholder="Căn cứ định giá (tuỳ chọn)"
                    th:text="${valuation != null ? valuation['rationale'] : ''}"></textarea>
        </div>
      </div>
    </section>

    <div class="inspect-actions">
      <a class="btn-c btn-c--ghost" th:href="@{/inspector/vehicles}">Huỷ</a>
      <button class="btn-c btn-c--primary" type="submit">Gửi duyệt</button>
    </div>
  </form>
  <script>
    (function () {
      var form = document.querySelector('#inspector-inspect .inspect-form');
      var select = document.getElementById('checklistId');
      if (!form || !select) return;
      select.addEventListener('change', function () {
        var base = form.getAttribute('data-inspect-base');
        if (!base) return;
        window.location.href = base + (base.indexOf('?') >= 0 ? '&' : '?') + 'checklistId=' + encodeURIComponent(select.value);
      });
    })();
  </script>
</div>
</body>
</html>
