<!DOCTYPE html>
<!--/* Nguyễn Vũ Trường An: thêm loại xe. */-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shell/layout :: page('Thêm loại xe', 'Kiểm định và tiếp nhận xe', 'vehicle-types',
                    null, ~{::link}, ~{::#vehicle-type-create})}">
<head>
  <title>Thêm loại xe</title>
  <th:block th:fragment="link">
    <link rel="stylesheet" th:href="@{/css/app/consignment-workflow.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-contracts.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-catalog.css}">
  </th:block>
</head>
<body>
<div id="vehicle-type-create" class="catalog-wrap">
  <div class="contracts-header">
    <div class="contracts-header-left">
      <div class="contracts-title-icon"><svg th:replace="~{shell/icons :: icon('plus')}"></svg></div>
      <div>
        <nav class="contracts-breadcrumb" aria-label="Vị trí trang">
          <a th:href="@{/inspector/vehicle-types}">Quản lý loại xe</a>
          <span>/</span>
          <span>Thêm mới</span>
        </nav>
        <h2>Thêm loại xe</h2>
      </div>
    </div>
  </div>

  <form class="catalog-form" method="post" th:action="@{/inspector/vehicle-types}" th:object="${form}">
    <p class="flash flash--error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}" role="alert"></p>
    <div class="form-row form-row--3">
      <div class="field">
        <label for="code">Mã loại xe <span class="req">*</span></label>
        <input type="text" th:field="*{code}" maxlength="40" placeholder="SUV, SEDAN, EV...">
        <span class="field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></span>
      </div>
      <div class="field">
        <label for="label">Tên hiển thị <span class="req">*</span></label>
        <input type="text" th:field="*{label}" maxlength="120" placeholder="SUV / Crossover">
        <span class="field-error" th:if="${#fields.hasErrors('label')}" th:errors="*{label}"></span>
      </div>
      <div class="field">
        <label for="status">Trạng thái</label>
        <select th:field="*{status}">
          <option th:value="ACTIVE">Đang dùng</option>
          <option th:value="INACTIVE">Ngưng hoạt động</option>
        </select>
        <span class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
      </div>
    </div>
    <div class="catalog-actions">
      <button class="btn-c btn-c--primary" type="submit">Lưu loại xe</button>
      <a class="btn-c btn-c--ghost" th:href="@{/inspector/vehicle-types}">Huỷ</a>
    </div>
  </form>
</div>
</body>
</html>
