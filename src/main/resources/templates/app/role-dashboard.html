<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="'GaragePro · ' + ${roleName}">GaragePro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --primary: #FF7A00; --ink: #1a1a1a; --muted: #5c5c5c; --bg: #f6f3ef; }
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: linear-gradient(160deg, #fff7ef 0%, #f0f4f8 55%, #eef2f7 100%); color: var(--ink); min-height: 100vh; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 2rem; background: rgba(255,255,255,.85); border-bottom: 1px solid rgba(0,0,0,.06); }
    .brand { font-weight: 800; font-size: 1.35rem; }
    .brand span { color: var(--primary); }
    .shell { max-width: 920px; margin: 3rem auto; padding: 0 1.25rem; }
    .hero-card { background: #fff; border-radius: 20px; padding: 2.25rem; box-shadow: 0 16px 40px rgba(0,0,0,.06); }
    .eyebrow { color: var(--primary); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: .8rem; margin-bottom: .5rem; }
    h1 { font-size: 1.9rem; margin: 0 0 .75rem; }
    .meta { color: var(--muted); margin-bottom: 1.5rem; }
    .pill { display: inline-block; background: rgba(255,122,0,.12); color: #c45e00; font-weight: 700; padding: .35rem .8rem; border-radius: 999px; font-size: .85rem; }
    .actions { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1.5rem; }
    .btn-orange { background: var(--primary); border: none; color: #fff; font-weight: 600; padding: .65rem 1.2rem; border-radius: 12px; text-decoration: none; }
    .btn-ghost { background: transparent; border: 1px solid #ddd; color: var(--ink); font-weight: 600; padding: .65rem 1.2rem; border-radius: 12px; text-decoration: none; }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">Garage<span>Pro</span> Consign</div>
    <form th:action="@{/auth/logout}" method="post">
      <button type="submit" class="btn btn-sm btn-outline-secondary">Đăng xuất</button>
    </form>
  </header>

  <main class="shell">
    <section class="hero-card">
      <p class="eyebrow" th:text="${roleName}">Vai trò</p>
      <h1 th:text="'Xin chào, ' + ${fullName}">Xin chào</h1>
      <p class="meta">
        Bạn đã đăng nhập với email
        <strong th:text="${email}">email</strong>
        · session gắn role
        <span class="pill" th:text="${roleCode}">ADMIN</span>
      </p>
      <p class="meta mb-0">
        Router được bảo vệ theo prefix tương ứng (ví dụ ADMIN → <code>/admin/**</code>).
        Landing hiện tại: <code th:text="${homePath}">/admin/dashboard</code>
      </p>
      <div class="actions">
        <a class="btn-orange" th:if="${roleKey == 'sales'}" th:href="@{/sales/buyers}">Buyer Management</a>
        <a class="btn-orange" th:href="@{/}">Về trang chủ</a>
        <a class="btn-ghost" th:if="${roleKey == 'admin'}" th:href="@{/ui}">UI preview (dev)</a>
      </div>
    </section>
  </main>
</body>
</html>
