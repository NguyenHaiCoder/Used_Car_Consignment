<!DOCTYPE html>
<!--/* Vũ Mạnh Cường: màn Ghi nhận hoàn cọc. Mở từ dòng Cần hoàn cọc ở Giao dịch thanh toán; số tiền lấy đúng tiền cọc, không sửa được.
       Phiếu cọc chọn Giữ cọc thì không vào màn này. */-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shell/layout :: page(${item.code}, 'Tài chính', 'finance-payments',
                    null, ~{::link}, ~{::#refund-detail})}">
<head>
  <title>Ghi nhận hoàn cọc</title>
  <th:block th:fragment="link">
    <link rel="stylesheet" th:href="@{/css/app/consignment-workflow.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-contracts.css}">
    <link rel="stylesheet" th:href="@{/css/app/consignment-create.css}">
    <link rel="stylesheet" th:href="@{/css/app/inspector-news.css}">
    <link rel="stylesheet" th:href="@{/css/app/sales-inquiry-forms.css}">
    <link rel="stylesheet" th:href="@{/css/app/sales-deals.css}">
    <link rel="stylesheet" th:href="@{/css/app/finance-deals.css}">
  </th:block>
</head>
<body>
<div id="refund-detail" class="inq-detail" th:with="s=${statuses.get(item.status)}, done=${item.status == 'REFUNDED'}">
  <div class="contracts-header">
    <div class="contracts-header-left">
      <div class="contracts-title-icon"><svg th:replace="~{shell/icons :: icon('undo')}"></svg></div>
      <div>
        <h2 th:text="${'Hoàn cọc ' + item.code}">Hoàn cọc</h2>
        <nav class="contracts-breadcrumb" aria-label="Vị trí trang">
          <a th:href="@{/finance/payments}">Giao dịch thanh toán</a>
          <span>/</span>
          <span th:text="${item.code}">HC</span>
        </nav>
      </div>
      <span class="pill" th:classappend="${'pill--' + s.pill}" th:text="${s.label}">Trạng thái</span>
    </div>
    <div class="contracts-header-actions">
      <a class="btn-c btn-c--ghost" th:href="@{/finance/payments}">Quay lại</a>
    </div>
  </div>

  <p class="flash" th:if="${flashMessage}" th:text="${flashMessage}" role="status"></p>
  <p class="flash flash--error" th:if="${flashError}" th:text="${flashError}" role="alert"></p>

  <div class="inq-detail-grid">
    <section class="card inq-card">
      <h3><svg th:replace="~{shell/icons :: icon('coins')}"></svg>Phiếu đặt cọc</h3>
      <dl class="inq-rows">
        <div><dt>Mã phiếu</dt><dd th:text="${item.reference}">DC</dd></div>
        <div><dt>Khách</dt><dd th:text="${item.buyer + ' · ' + item.phone}">Khách</dd></div>
        <div><dt>Xe</dt><dd th:text="${item.car + ' · ' + item.plate}">Xe</dd></div>
        <div><dt>Lý do</dt><dd th:text="${item.reason == '' ? 'Hết hạn giữ xe' : item.reason}">Lý do</dd></div>
        <div><dt>Số tiền hoàn</dt><dd class="deal-amount" th:text="${#numbers.formatInteger(item.amount, 1, 'POINT') + ' ₫'}">0 ₫</dd></div>
      </dl>
    </section>

    <section class="card inq-card" th:if="${done}">
      <h3><svg th:replace="~{shell/icons :: icon('check')}"></svg>Đã hoàn cọc</h3>
      <dl class="inq-rows">
        <div><dt>Ngày hoàn</dt><dd th:text="${#temporals.format(#temporals.createDate(item.done.paidOn), 'dd/MM/yyyy')}">01/01/2026</dd></div>
        <div><dt>Phương thức</dt><dd th:text="${item.done.method}">Phương thức</dd></div>
        <div><dt>Mã tham chiếu</dt><dd th:text="${item.done.reference}">Mã</dd></div>
        <div><dt>Người ghi</dt><dd th:text="${item.done.staff}">NV</dd></div>
        <div th:if="${item.done.note != ''}"><dt>Ghi chú</dt><dd th:text="${item.done.note}">Ghi chú</dd></div>
      </dl>
    </section>

    <form class="section-card create-wrap transfer-form" method="post" th:unless="${done}"
          th:action="@{/finance/payments/refunds/{id}(id=${item.id})}">
      <div class="section-head">
        <svg th:replace="~{shell/icons :: icon('undo')}"></svg>
        <h3>Ghi nhận hoàn tiền</h3>
      </div>
      <div class="section-body">
        <div class="field">
          <label for="rf-method">Phương thức <span class="req">*</span></label>
          <span class="select">
            <select id="rf-method" name="method" required>
              <option th:each="m : ${methods}" th:value="${m}" th:text="${m}">Phương thức</option>
            </select>
          </span>
        </div>
        <div class="field">
          <label for="rf-reference">Mã tham chiếu <span class="req">*</span></label>
          <div class="field-input"><input id="rf-reference" name="reference" maxlength="60" required
                                          placeholder="Ví dụ: mã giao dịch ngân hàng"></div>
        </div>
        <div class="field">
          <label for="rf-note">Ghi chú</label>
          <textarea class="field-textarea" id="rf-note" name="note" rows="2" maxlength="1000"></textarea>
        </div>
        <div class="fin-actions">
          <button class="btn-c btn-c--primary" type="submit">Ghi nhận hoàn cọc</button>
        </div>
      </div>
    </form>
  </div>
</div>
</body>
</html>
