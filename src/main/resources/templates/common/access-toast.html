<!DOCTYPE html>
<!--/* Nguyễn Việt Hải: toast báo không có quyền, dùng chung cho shell/layout và common/layout.
       Hiện khi có flash "permissionDenied" (chức năng bị Admin tắt) hoặc ?accessDenied=1 (vào nhầm khu vực role khác). */-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="accessToast"
          th:with="deniedText=${permissionDenied != null ? permissionDenied
                    : (param.accessDenied != null ? 'Bạn không có quyền truy cập trang này, vui lòng liên hệ quản trị viên.' : null)}">
  <th:block th:if="${deniedText != null}">
    <style>
      .access-toast{position:fixed;top:72px;right:20px;z-index:3000;display:flex;align-items:flex-start;gap:12px;
        width:min(420px,calc(100vw - 32px));padding:14px 16px;border-radius:12px;background:#fff;color:#1f2937;
        border:1px solid #fecaca;border-left:5px solid #dc2626;box-shadow:0 18px 40px rgba(15,23,42,.18);
        font:500 14px/1.5 "Be Vietnam Pro","Segoe UI",sans-serif;animation:access-toast-in .25s ease-out}
      .access-toast[hidden]{display:none}
      .access-toast-icon{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
        background:#fee2e2;color:#b91c1c;font-weight:800}
      .access-toast-body{flex:1;min-width:0}
      .access-toast-body strong{display:block;font-weight:700;color:#991b1b}
      .access-toast-close{flex:none;border:0;background:transparent;color:#6b7280;font-size:20px;line-height:1;
        cursor:pointer;padding:2px 4px;border-radius:6px}
      .access-toast-close:hover{background:#f3f4f6;color:#111827}
      @keyframes access-toast-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.access-toast{animation:none}}
    </style>
    <div class="access-toast" id="access-toast" role="alert" aria-live="assertive">
      <span class="access-toast-icon" aria-hidden="true">!</span>
      <div class="access-toast-body">
        <strong>Không có quyền truy cập</strong>
        <span th:text="${deniedText}">Bạn không có quyền thực hiện chức năng này, vui lòng liên hệ quản trị viên.</span>
      </div>
      <button type="button" class="access-toast-close" aria-label="Đóng thông báo">×</button>
    </div>
    <script>
      (function () {
        var box = document.getElementById('access-toast');
        if (!box) return;
        var hide = function () { box.hidden = true; };
        box.querySelector('.access-toast-close').addEventListener('click', hide);
        setTimeout(hide, 6000);
        // Bỏ ?accessDenied=1 khỏi thanh địa chỉ để F5 không hiện lại.
        var url = new URL(window.location.href);
        if (url.searchParams.has('accessDenied')) {
          url.searchParams.delete('accessDenied');
          history.replaceState(null, '', url.pathname + url.search + url.hash);
        }
      })();
    </script>
  </th:block>
</th:block>
</body>
</html>
