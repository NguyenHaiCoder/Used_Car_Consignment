<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="shell(content)">
<head th:replace="~{common/header :: head(${screen.title})}"></head>
<body class="ui-app" th:attr="data-route=${route},data-role=${role.key},data-kind=${screen.kind},data-status=${screen.status},data-app=${appShell} ? '1' : '0'">
  <a class="skip-link" href="#main">Bỏ qua điều hướng</a>
  <div th:replace="~{common/sidebar :: sidebar}"></div>
  <button class="nav-overlay" aria-label="Đóng điều hướng" hidden></button>
  <header th:replace="~{common/header :: header}"></header>
  <main id="main" class="main-content" tabindex="-1">
    <nav th:replace="~{common/breadcrumbs :: breadcrumbs}"></nav>
    <div th:replace="~{common/page-header :: pageHeader}"></div>
    <p class="preview-note" th:unless="${appShell}"><strong>Bản xem trước UI</strong> · Dữ liệu mẫu. Thao tác chỉ diễn ra trong trình duyệt, chưa gửi đến hệ thống.</p>
    <section th:replace="${content}"></section>
    <footer th:replace="~{common/footer :: footer}"></footer>
  </main>
  <div th:replace="~{common/notifications :: notifications}"></div>
  <script th:src="@{/js/ui/app.js}" defer></script>
</body>
</html>
