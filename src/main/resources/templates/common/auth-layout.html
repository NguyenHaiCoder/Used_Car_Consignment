<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="shell(content)">
<head th:replace="~{common/header :: head(${screen.title})}"></head>
<body class="ui-app auth-page" th:attr="data-route=${route},data-kind=${screen.kind},data-role='auth'">
<main class="auth-card">
  <aside class="auth-brand">
    <a class="logo" th:href="@{/home}"><span class="orange">Garage</span>Pro <small>CONSIGN</small></a>
    <div><p class="eyebrow">UCCMS</p><h1>Quản lý hành trình ký gửi.</h1><p>Từ tiếp nhận xe đến hoàn tất sang tên và bàn giao.</p></div>
    <a class="button" th:href="@{/ui}">URL theo từng role →</a>
  </aside>
  <section class="auth-form">
    <h2 th:text="${screen.title}"></h2>
    <p th:text="${screen.description}"></p>
    <p class="preview-note">Bản xem trước UI. Không đăng nhập thật hoặc gửi email.</p>
    <section th:replace="${content}"></section>
  </section>
</main>
<div th:replace="~{common/notifications :: notifications}"></div>
<script th:src="@{/js/ui/app.js}" defer></script>
</body>
</html>
